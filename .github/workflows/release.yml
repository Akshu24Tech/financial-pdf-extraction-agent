# CD pipeline — runs ONLY when you push a version tag (e.g. v0.1.0).
# Builds the package and publishes a GitHub Release with the artifacts.
# Separate from ci.yml: different trigger, different job, different purpose.
name: Release

on:
  push:
    tags:
      - "v*"          # v0.1.0, v1.2.3, ... normal commits never trigger this

# A release WRITES to the repo (creates the Release). CI only reads, so it
# needed nothing. Least privilege: grant exactly this and no more.
permissions:
  contents: write     # create the GitHub Release
  id-token: write     # mint the short-lived OIDC token TestPyPI/PyPI verifies
                      # for Trusted Publishing (no stored password/secret)

jobs:
  release:
    runs-on: ubuntu-latest
    # A named deployment target. MUST match the environment registered as the
    # trusted publisher on TestPyPI. Also where you can later add approval gates.
    environment: testpypi
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # one build is enough: the wheel is
                                   # py3-none-any (version-independent)

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build          # produces dist/*.whl and dist/*.tar.gz

      - name: Publish to TestPyPI
        # Official PyPA action. Reads dist/*, does the whole OIDC handshake.
        # repository-url points at TestPyPI; drop this line to target real PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*                 # attach wheel + sdist to the Release
          generate_release_notes: true  # auto-notes from merged PRs
