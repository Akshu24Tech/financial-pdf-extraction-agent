# CI pipeline — runs automatically on every push and every pull request.
# Now tests across multiple Python versions in parallel, caches dependencies
# for speed, and reports a single overall "all green" check.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A MATRIX: GitHub runs this whole job once per value below, in parallel.
    # So we get three jobs — test (3.11), test (3.12), test (3.13) — and the
    # code must pass on all of them.
    strategy:
      fail-fast: false        # if one version fails, still run the others
                              # (so you see ALL failures, not just the first)
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}   # value from the matrix
          cache: pip          # CACHING: reuse downloaded packages between runs
                              # instead of re-downloading every time -> faster CI

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff reportlab   # reportlab builds the e2e test PDF
          pip install -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Verify single-file bundle sync
        run: PYTHONPATH=. python -m finagent.bundler --check



      - name: Run tests
        run: pytest -v


  # Build the Docker image and prove it actually serves, on every push.
  # A Dockerfile that builds but crashes on start is caught here, not in prod.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t finagent:ci .

      - name: Start the container
        run: docker run -d --name finagent -p 8501:8501 finagent:ci

      - name: Wait until it reports healthy
        # Uses the image's own HEALTHCHECK, so CI tests what the host will see.
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' finagent)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "Container never became healthy. Logs:"
          docker logs finagent
          exit 1

      - name: Smoke-test the HTTP endpoint
        run: curl --fail --silent http://localhost:8501/_stcore/health

  # A GATE job: succeeds only if EVERY job above passed (all test versions + docker).
  # We require THIS single check in branch protection, so the protection rule
  # never breaks when we add/remove Python versions from the matrix.
  all-green:
    if: always()              # run even if the matrix failed, so it can report
    needs: [test, docker]     # wait for tests AND the image check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every test job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "A test job or the Docker image check failed."
            exit 1
          fi
          echo "All tests passed and the image serves."
