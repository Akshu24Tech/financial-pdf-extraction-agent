# Project + tool config. Keeping ruff (lint) and pytest settings here means
# the same rules run locally and in CI — no drift between your machine and the
# pipeline.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Default ruff rules (pyflakes F + a sane pycodestyle subset E) catch real
# bugs — undefined names, unused imports, syntax errors — without nitpicking
# style. Tighten later (Level 7) once the habit is in place.
ignore = ["E741"]   # allow short names like `l`, `r` in the math helpers

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add the project root to the import path so `import finagent` works no matter
# how pytest is launched (`pytest` vs `python -m pytest`). Without this, bare
# `pytest` can't find the package — which is exactly what broke CI once.
pythonpath = ["."]
