# Project + tool config. Keeping ruff (lint) and pytest settings here means
# the same rules run locally and in CI — no drift between your machine and the
# pipeline.

[build-system]
# WHO builds the package. setuptools is the standard, batteries-included
# backend. `python -m build` reads this section first to know how to package.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# WHAT the package is — its public identity / metadata.
# Distribution name on PyPI (must be globally unique + not "too similar" to an
# existing project). The IMPORT name stays `finagent` (the package dir) — PyPI
# name and import name are allowed to differ.
name = "akshu-finagent"
version = "0.2.0"
description = "Financial statement PDF extraction agent"
readme = "README.md"
requires-python = ">=3.11"
# Baked INTO the wheel so `pip install` pulls these automatically.
# (Mirrors requirements.txt, which is only for local dev setup — that file is
# not read at install time.)
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.14",
]

[project.scripts]
finagent = "finagent.cli:main"


[tool.setuptools]
# The standalone single-file module at the repo root.
py-modules = ["finagent_single"]

# Auto-discover finagent AND its subpackages (finagent.extractors, plus any
# added later). Hand-listing `packages = ["finagent"]` silently dropped the
# extractors subpackage from the wheel — a build can "succeed" yet ship a
# broken, un-importable package. The `finagent*` filter also keeps tests/ and
# golden/ OUT of the distribution.
[tool.setuptools.packages.find]
include = ["finagent*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Default ruff rules (pyflakes F + a sane pycodestyle subset E) catch real
# bugs — undefined names, unused imports, syntax errors — without nitpicking
# style. Tighten later (Level 7) once the habit is in place.
ignore = ["E741"]   # allow short names like `l`, `r` in the math helpers

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add the project root to the import path so `import finagent` works no matter
# how pytest is launched (`pytest` vs `python -m pytest`). Without this, bare
# `pytest` can't find the package — which is exactly what broke CI once.
pythonpath = ["."]
