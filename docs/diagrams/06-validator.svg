<svg viewBox="0 0 1280 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#475569}
      .stage{font-size:18px;font-weight:700;fill:#0f172a}
      .fn{font-size:15px;font-weight:700;fill:#15803d;font-family:Consolas,'Courier New',monospace}
      .role{font-size:13.5px;fill:#334155}
      .io{font-size:15px;font-weight:700;fill:#ffffff}
      .cap{font-size:12.5px;fill:#64748b}
      .k{font-size:13px;font-weight:700;fill:#0f172a}
      .mono{font-family:Consolas,'Courier New',monospace;font-size:13px;fill:#14532d}
    </style>
  </defs>
  <rect width="1280" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#16a34a"/>

  <text x="56" y="62" class="title">Stage 6 &#183; Validator  <tspan font-size="20" fill="#16a34a">validator.py</tspan></text>
  <text x="56" y="90" class="sub">The paranoid clerk. Statements are self-verifying: accounting identities &amp; cross-statement ties confirm a value with NO ground truth.</text>

  <!-- input -->
  <rect x="56" y="124" width="340" height="54" rx="10" fill="#0f172a" filter="url(#sh)"/>
  <text x="226" y="157" text-anchor="middle" class="io">proposed values  (Validator.add)</text>
  <line x1="226" y1="178" x2="226" y2="210" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- validate steps -->
  <rect x="56" y="212" width="700" height="286" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="240" class="fn">validate()</text>
  <text x="76" y="266" class="role">1.  <tspan class="k">Consensus</tspan> = median of proposals per metric (one wild reading can&#39;t drag it).</text>
  <text x="76" y="290" class="role">2.  <tspan class="k">Cross-extractor voting</tspan> &#8212; several extractors agree &#8594; pass; disagree &#8594; flag.</text>
  <text x="76" y="314" class="role">3.  Run every <tspan class="k">identity check</tspan>: build left &amp; right sums, pass if they tie.</text>
  <text x="76" y="338" class="role">4.  Run <tspan class="k">cross-statement ties</tspan> the same way.</text>
  <text x="76" y="362" class="role">5.  Status per metric:</text>
  <text x="96" y="386" class="role"><tspan class="k">FLAGGED</tspan> if any check failed  &#8594;  else <tspan class="k">VERIFIED</tspan> if any passed  &#8594;  else <tspan class="k">PROBABLE</tspan>.</text>
  <text x="76" y="412" class="role">6.  Expected metric never seen  &#8594;  <tspan class="k">MISSING</tspan>.</text>
  <text x="76" y="446" class="k">within_tolerance(a, b)</text>
  <text x="76" y="468" class="role">Rounding-aware equality &#8212; a sum of rounded line items may differ by a unit</text>
  <text x="76" y="488" class="role">or two (0.5% relative or 2 absolute), so honest rounding isn&#39;t FLAGGED.</text>

  <line x1="406" y1="498" x2="406" y2="530" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- verdicts out -->
  <rect x="56" y="532" width="700" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="560" class="k" font-size="14">ValidationReport  &#8212;  a MetricVerdict per metric (status, value, page, receipts)</text>
  <rect x="76" y="576" width="118" height="30" rx="6" fill="#C6EFCE"/><text x="135" y="596" text-anchor="middle" class="k" fill="#14532d">VERIFIED</text>
  <rect x="200" y="576" width="118" height="30" rx="6" fill="#FFEB9C"/><text x="259" y="596" text-anchor="middle" class="k" fill="#713f12">PROBABLE</text>
  <rect x="324" y="576" width="112" height="30" rx="6" fill="#FFC7CE"/><text x="380" y="596" text-anchor="middle" class="k" fill="#7f1d1d">FLAGGED</text>
  <rect x="442" y="576" width="108" height="30" rx="6" fill="#D9D9D9"/><text x="496" y="596" text-anchor="middle" class="k" fill="#334155">MISSING</text>
  <rect x="556" y="576" width="108" height="30" rx="6" fill="#BDD7EE"/><text x="610" y="596" text-anchor="middle" class="k" fill="#1e3a5f">DERIVED</text>
  <text x="76" y="628" class="cap">print_summary() &#8594; console scoreboard  &#183;  to_dict() &#8594; feeds the Excel writer</text>

  <!-- identity checks sidebar -->
  <rect x="792" y="124" width="432" height="374" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#sh)"/>
  <text x="812" y="150" class="k" font-size="14">IDENTITY_CHECKS  (rules as data)</text>
  <text x="812" y="176" class="role">sum(left) == sum(right):</text>
  <text x="812" y="204" class="mono">assets = liabilities + equity</text>
  <text x="812" y="228" class="mono">assets = current + non_current</text>
  <text x="812" y="252" class="mono">PBT = net_profit + tax</text>
  <text x="812" y="276" class="mono">income = revenue + other_income</text>
  <text x="812" y="300" class="mono">net_change = ops + inv + fin (+fx)</text>
  <line x1="812" y1="322" x2="1204" y2="322" stroke="#bbf7d0" stroke-width="1.4"/>
  <text x="812" y="348" class="k" font-size="13">CROSS_STATEMENT_CHECKS</text>
  <text x="812" y="368" class="role">closing cash (CF) == cash &amp; equivalents (BS)</text>
  <text x="812" y="386" class="role">&#8212; read from different pages, so a powerful</text>
  <text x="812" y="404" class="role">independent check.</text>
  <line x1="812" y1="424" x2="1204" y2="424" stroke="#bbf7d0" stroke-width="1.4"/>
  <text x="812" y="450" class="k" font-size="13">SIGN_AMBIGUOUS = {tax_expense}</text>
  <text x="812" y="470" class="role">Tax is positive in Indian reports, negative in</text>
  <text x="812" y="488" class="role">EU/IFRS &#8212; identities try both signs.</text>

  <!-- why -->
  <rect x="792" y="532" width="432" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="814" y="560" class="stage" font-size="16" fill="#92400e">Why it&#39;s built this way</text>
  <text x="814" y="588" class="role">The optional fx effect sits INSIDE the sum in</text>
  <text x="814" y="608" class="role">some layouts (BMW), OUTSIDE in others (Airtel)</text>
  <text x="814" y="628" class="role">&#8212; the check tries with-fx first, then without.</text>

  <!-- big statement -->
  <rect x="56" y="680" width="1168" height="130" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/>
  <text x="80" y="712" class="stage" fill="#15803d">The whole point</text>
  <text x="80" y="744" class="role">When unsure, the system produces a <tspan class="k">visible gap (MISSING)</tspan> or a <tspan class="k">visible warning (FLAGGED)</tspan> &#8212; never a confident wrong number.</text>
  <text x="80" y="772" class="role">A human can fill a gap and catch a flag; a human cannot catch a lie that looks right. This verification layer is the real value of the project.</text>
  <text x="80" y="796" class="cap">reading (stages 1&#8211;5) is allowed to be imperfect &#183; proving (stage 6) is what makes the output trustworthy</text>
</svg>
