<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#475569}
      .stage{font-size:18px;font-weight:700;fill:#0f172a}
      .fn{font-size:15px;font-weight:700;fill:#1d4ed8;font-family:Consolas,'Courier New',monospace}
      .role{font-size:13.5px;fill:#334155}
      .io{font-size:14px;font-weight:700;fill:#ffffff}
      .cap{font-size:12.5px;fill:#64748b}
      .k{font-size:13px;font-weight:700;fill:#0f172a}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#60a5fa"/>

  <text x="56" y="62" class="title">Stage 2 &#183; Geometry  <tspan font-size="20" fill="#3b82f6">geometry.py</tspan></text>
  <text x="56" y="90" class="sub">Some reports print TWO logical pages side by side on one wide A3 sheet. Find the spine and split &#8212; but never split a genuinely wide table.</text>

  <!-- the problem visual -->
  <text x="56" y="138" class="k" font-size="14">The problem: a two-up sheet</text>
  <rect x="56" y="150" width="420" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="266" y1="150" x2="266" y2="300" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="266" y="320" text-anchor="middle" class="cap" fill="#ef4444">gutter / spine</text>
  <text x="76" y="180" class="role">Trade receivables</text>
  <text x="76" y="204" class="role">Cash and bank</text>
  <text x="76" y="228" class="role">Total assets</text>
  <text x="286" y="180" class="role">1,24,500</text>
  <text x="286" y="204" class="role">88,207</text>
  <text x="286" y="228" class="role">4,467,716</text>
  <text x="76" y="268" class="cap">read naively &#8594; "label-left   numbers-right" = garbage</text>

  <!-- arrow -->
  <line x1="500" y1="225" x2="548" y2="225" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- split result -->
  <rect x="556" y="150" width="200" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="656" y="230" text-anchor="middle" class="k" fill="#1d4ed8">left page</text>
  <rect x="772" y="150" width="200" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="872" y="230" text-anchor="middle" class="k" fill="#1d4ed8">right page</text>
  <text x="556" y="324" class="cap">two clean logical pages</text>

  <!-- functions -->
  <rect x="56" y="360" width="560" height="150" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="388" class="fn">_gutter_x(page_width, words)</text>
  <text x="76" y="412" class="role">Build a 200-strip coverage histogram. Among near-empty</text>
  <text x="76" y="432" class="role">strips in the <tspan class="k">middle third</tspan>, pick the one CLOSEST to</text>
  <text x="76" y="452" class="role">centre &#8212; not the emptiest (a table&#39;s label/number gap can</text>
  <text x="76" y="472" class="role">be emptier than the true spine). Returns x, or None.</text>

  <rect x="636" y="360" width="508" height="150" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="656" y="388" class="fn">split_two_up(page, words)</text>
  <text x="656" y="412" class="role">Guard rails, in order &#8212; any failure &#8594; not two-up:</text>
  <text x="656" y="434" class="role">&#8226;  not landscape, or &lt; 20 words</text>
  <text x="656" y="454" class="role">&#8226;  one side nearly empty &#8594; a wide single table</text>
  <text x="656" y="474" class="role">&#8226;  a side that is <tspan class="k">mostly numbers</tspan> &#8594; value-column block</text>
  <text x="656" y="494" class="cap">logical_pages() wraps it: returns [left, right] or [words]</text>

  <!-- constants -->
  <rect x="56" y="534" width="560" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="76" y="562" class="k" font-size="14">The thresholds (deliberately strict)</text>
  <text x="76" y="588" class="role">SEARCH_LO/HI 0.35&#8211;0.65 &#8212; spine lives in the middle third</text>
  <text x="76" y="610" class="role">MAX_GUTTER_COVERAGE 0.01 &#8212; spine strip must be near-empty</text>
  <text x="76" y="632" class="role">MIN_SIDE_RATIO 0.2 &#8212; both halves must carry real text</text>

  <!-- why -->
  <rect x="636" y="534" width="508" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="656" y="562" class="stage" font-size="16" fill="#92400e">Why it&#39;s built this way</text>
  <text x="656" y="588" class="role">A wide single table (BMW&#39;s landscape balance sheet) must</text>
  <text x="656" y="608" class="role">NOT be split &#8212; so the two-up test is conservative. Everything</text>
  <text x="656" y="628" class="role">downstream just iterates "logical pages", split or not.</text>
</svg>
