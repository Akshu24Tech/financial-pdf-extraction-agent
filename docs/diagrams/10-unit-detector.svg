<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#475569}
      .fn{font-size:15px;font-weight:700;fill:#0369a1;font-family:Consolas,'Courier New',monospace}
      .role{font-size:13.5px;fill:#334155}
      .io{font-size:15px;font-weight:700;fill:#ffffff}
      .cap{font-size:12.5px;fill:#64748b}
      .k{font-size:13px;font-weight:700;fill:#0f172a}
      .mono{font-family:Consolas,'Courier New',monospace;font-size:13px;fill:#0c4a6e}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#38bdf8"/>

  <text x="56" y="62" class="title">Stage 1b &#183; Unit &amp; Period Anchor  <tspan font-size="18" fill="#0369a1">unit_detector.py</tspan></text>
  <text x="56" y="90" class="sub">Read the scale and period from the first pages&#39; text, so "1,234" is understood as &#8377;1,234 crore for FY25 &#8212; not a bare number.</text>

  <!-- input -->
  <rect x="56" y="128" width="340" height="54" rx="10" fill="#0f172a" filter="url(#sh)"/>
  <text x="226" y="161" text-anchor="middle" class="io">header text of first ~15 pages</text>

  <!-- detect_unit -->
  <rect x="56" y="214" width="540" height="190" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="242" class="fn">detect_unit(text)  &#8594;  UnitInfo</text>
  <text x="76" y="266" class="role">First matching UNIT_PATTERN wins:</text>
  <text x="76" y="292" class="mono">&#8377; in Crores   &#8594;  INR  &#215; 10,000,000</text>
  <text x="76" y="316" class="mono">&#8377; in Lakhs    &#8594;  INR  &#215; 100,000</text>
  <text x="76" y="340" class="mono">USD Millions  &#8594;  USD  &#215; 1,000,000</text>
  <text x="76" y="364" class="mono">in Thousands  &#8594;  &#215; 1,000</text>
  <text x="76" y="392" class="cap">no match &#8594; Units, UNKNOWN, &#215;1 (safe default)</text>

  <!-- detect_periods -->
  <rect x="628" y="214" width="516" height="190" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" filter="url(#sh)"/>
  <text x="648" y="242" class="fn">detect_periods(text)  &#8594;  PeriodHeader</text>
  <text x="648" y="266" class="role">Regex finds comparative dates:</text>
  <text x="648" y="292" class="mono">"as at 31 March 2025"</text>
  <text x="648" y="316" class="mono">"for the year ended &#8230;"  &#183;  "FY25"</text>
  <text x="648" y="348" class="role">First unique date = current period,</text>
  <text x="648" y="368" class="role">second = prior. Dedupes as it scans.</text>
  <text x="648" y="396" class="cap">current='31 March 2025', prior='31 March 2024'</text>

  <!-- note -->
  <rect x="56" y="436" width="1088" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="78" y="464" class="fn" fill="#92400e" font-size="16">Why it matters</text>
  <text x="78" y="494" class="role">&#8226;  The same printed figure means different money in different reports &#8212; crore vs million vs thousand. The anchor fixes the scale once.</text>
  <text x="78" y="522" class="role">&#8226;  Pattern order is deliberate: specific currency+scale patterns ("&#8377; in crores") are tried before the loose "in millions" fallback.</text>
  <text x="78" y="550" class="role">&#8226;  A pure read step with a safe default &#8212; it never fails the run, it just labels what it found (logged by the pipeline as the unit anchor).</text>
  <text x="78" y="578" class="cap">currently an informational anchor logged at run start; the extracted values stay in the report&#39;s printed unit.</text>
</svg>
