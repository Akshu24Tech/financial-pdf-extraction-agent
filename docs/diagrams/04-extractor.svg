<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#475569}
      .stage{font-size:18px;font-weight:700;fill:#0f172a}
      .fn{font-size:15px;font-weight:700;fill:#1d4ed8;font-family:Consolas,'Courier New',monospace}
      .role{font-size:13.5px;fill:#334155}
      .io{font-size:15px;font-weight:700;fill:#ffffff}
      .cap{font-size:12.5px;fill:#64748b}
      .k{font-size:13px;font-weight:700;fill:#0f172a}
    </style>
  </defs>
  <rect width="1280" height="1000" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#3b82f6"/>

  <text x="56" y="62" class="title">Stage 4 &#183; Extractor  <tspan font-size="20" fill="#3b82f6">extractors/geometric.py</tspan></text>
  <text x="56" y="90" class="sub">Financial tables are borderless &#8212; no lines to detect. Rebuild visual rows from word coordinates, then split each into "label + numbers".</text>

  <!-- entry flow -->
  <rect x="56" y="124" width="320" height="54" rx="10" fill="#0f172a" filter="url(#sh)"/>
  <text x="216" y="157" text-anchor="middle" class="io">located pages + cue_pats</text>
  <line x1="216" y1="178" x2="216" y2="210" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="56" y="212" width="700" height="150" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="240" class="fn">extract(pdf_path, page_indices, cue_pats, want_basis)</text>
  <text x="76" y="264" class="role">1.  Open each page with pdfplumber, pull words.</text>
  <text x="76" y="286" class="role">2.  Drop <tspan class="k">rotated words</tspan> (vertical margin tabs) &#8212; unless the whole page is rotated.</text>
  <text x="76" y="308" class="role">3.  <tspan class="fn" font-size="13">geometry.logical_pages</tspan> &#8594; split two-up; keep the half that matches the cues.</text>
  <text x="76" y="330" class="role">4.  Run <tspan class="fn" font-size="13">_items_from_words</tspan> on each group.</text>
  <text x="76" y="352" class="cap">does NOT parse numbers &#8212; output stays raw</text>

  <line x1="406" y1="362" x2="406" y2="394" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- the hard function -->
  <rect x="56" y="396" width="700" height="326" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="76" y="424" class="fn">_items_from_words()  &#8212; the most intricate function</text>
  <text x="76" y="446" class="role">Scans rows top-to-bottom, carrying context single rows don&#39;t hold:</text>
  <rect x="76" y="460" width="320" height="30" rx="6" fill="#dbeafe"/><text x="90" y="480" class="k" fill="#1e3a8a">section</text><text x="150" y="480" class="role">current heading ("ASSETS")</text>
  <rect x="76" y="496" width="320" height="30" rx="6" fill="#dbeafe"/><text x="90" y="516" class="k" fill="#1e3a8a">side</text><text x="150" y="516" class="role">current vs non-current block</text>
  <rect x="408" y="460" width="330" height="30" rx="6" fill="#dbeafe"/><text x="422" y="480" class="k" fill="#1e3a8a">pending</text><text x="492" y="480" class="role">bare-number subtotal candidate</text>
  <rect x="408" y="496" width="330" height="30" rx="6" fill="#dbeafe"/><text x="422" y="516" class="k" fill="#1e3a8a">prev_text</text><text x="498" y="516" class="role">rejoin a wrapped label</text>
  <text x="76" y="552" class="role">For each row: merge detached minus &#8594; find label | number boundary &#8594;</text>
  <text x="76" y="574" class="role">fix split parenthesis "(refer note" | "15)" &#8594; classify the row:</text>
  <text x="96" y="600" class="role">&#8226;  label + numbers  &#8594;  real line item (RawItem)</text>
  <text x="96" y="622" class="role">&#8226;  numbers, no label (inside a block)  &#8594;  stash as pending subtotal</text>
  <text x="96" y="644" class="role">&#8226;  text only  &#8594;  heading: set section &amp; side, flush pending</text>
  <text x="76" y="676" class="role"><tspan class="k">_detect_value_floor</tspan>: anchor on the Note/Year header row to cut reference</text>
  <text x="76" y="696" class="role">columns by POSITION &#8212; so a bare "5" under a year header reads as a value.</text>

  <line x1="406" y1="722" x2="406" y2="754" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="196" y="756" width="420" height="56" rx="10" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="406" y="790" text-anchor="middle" class="io">list of RawItem(label, values, page, side)</text>

  <!-- right column helpers -->
  <rect x="792" y="124" width="432" height="300" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8" filter="url(#sh)"/>
  <text x="812" y="150" class="k" font-size="14">Handling real-world messiness</text>
  <text x="812" y="178" class="fn" font-size="14">_merge_detached_minus</text>
  <text x="812" y="198" class="role">European reports print "&#8722; 112,858" as two</text>
  <text x="812" y="216" class="role">words. Glue the minus to its number only if</text>
  <text x="812" y="234" class="role">close (MAX_SIGN_GAP 4.0); a lone "&#8722;" stays nil.</text>
  <text x="812" y="264" class="fn" font-size="14">_detect_column_bases</text>
  <text x="812" y="284" class="role">Reads column headers "Standalone" vs</text>
  <text x="812" y="302" class="role">"Consolidated" and keeps only the wanted</text>
  <text x="812" y="320" class="role">basis&#39;s x-range (multi-column tables).</text>
  <text x="812" y="350" class="fn" font-size="14">_matches_statement</text>
  <text x="812" y="370" class="role">On a split sheet, picks the half belonging to</text>
  <text x="812" y="388" class="role">the target statement &#8212; threshold just 1 cue</text>
  <text x="812" y="406" class="role">(the locator already vouched for the page).</text>

  <!-- why -->
  <rect x="792" y="440" width="432" height="282" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="814" y="468" class="stage" font-size="16" fill="#92400e">Why it&#39;s built this way</text>
  <text x="814" y="496" class="role">&#8226;  A subtotal is always the LAST row of its</text>
  <text x="814" y="516" class="role">   block &#8212; so a pending bare-number row is</text>
  <text x="814" y="536" class="role">   only accepted when a total/net row closes it.</text>
  <text x="814" y="566" class="role">&#8226;  Banks label a section total just "Total" &#8212;</text>
  <text x="814" y="586" class="role">   qualified with its section ("total assets").</text>
  <text x="814" y="616" class="role">&#8226;  Cut reference columns by POSITION, not</text>
  <text x="814" y="636" class="role">   magnitude &#8212; guarded so it never wipes</text>
  <text x="814" y="656" class="role">   out every number on a row.</text>
  <text x="814" y="686" class="role">&#8226;  Every wrong guess degrades to a failed</text>
  <text x="814" y="706" class="role">   match later (MISSING), never a wrong value.</text>
</svg>
