<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#475569}
      .stage{font-size:18px;font-weight:700;fill:#0f172a}
      .fn{font-size:15px;font-weight:700;fill:#1d4ed8;font-family:Consolas,'Courier New',monospace}
      .role{font-size:13.5px;fill:#334155}
      .io{font-size:15px;font-weight:700;fill:#ffffff}
      .cap{font-size:12.5px;fill:#64748b}
      .k{font-size:13px;font-weight:700;fill:#0f172a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#3b82f6"/>

  <text x="56" y="62" class="title">Stage 1 &#183; Profiler  <tspan font-size="20" fill="#3b82f6">profiler.py</tspan></text>
  <text x="56" y="90" class="sub">Describe the PDF page by page so later stages know what they&#39;re dealing with. Uses pypdf (fast) &#8212; this pass touches EVERY page.</text>

  <!-- input -->
  <rect x="56" y="130" width="200" height="54" rx="10" fill="#0f172a" filter="url(#sh)"/>
  <text x="156" y="163" text-anchor="middle" class="io">PDF file</text>
  <line x1="256" y1="157" x2="300" y2="157" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- profile() -->
  <rect x="306" y="118" width="500" height="238" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="326" y="146" class="fn">profile(pdf_path)  &#8212; loop every page</text>
  <text x="326" y="174" class="role">1.  Read page box &#8594; width / height.</text>
  <text x="326" y="198" class="role">2.  If rotated 90&#176;/270&#176;, swap w/h so "landscape" is true.</text>
  <text x="326" y="222" class="role">3.  Extract text (try/except: bad encoding &#8594; empty).</text>
  <text x="326" y="246" class="role">4.  Grade it with <tspan class="fn" font-size="13">_quality</tspan>.</text>
  <text x="326" y="270" class="role">5.  Run <tspan class="fn" font-size="13">geometry.logical_pages</tspan> &#8594; split two-up sheets.</text>
  <text x="326" y="294" class="role">6.  flush_cache() &#8212; keeps a 600-page report inside RAM.</text>
  <text x="326" y="330" class="cap">builds both a PageProfile list and a logical_pages list</text>

  <line x1="806" y1="237" x2="852" y2="237" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="858" y="150" width="286" height="176" rx="12" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="1001" y="182" text-anchor="middle" class="io" font-size="16">DocProfile</text>
  <text x="878" y="212" class="role" fill="#dbeafe">path, n_pages</text>
  <text x="878" y="236" class="role" fill="#dbeafe">pages: [PageProfile]</text>
  <text x="878" y="260" class="role" fill="#dbeafe">logical_pages: [&#8230;]</text>
  <text x="878" y="288" class="role" fill="#bfdbfe">landscape_ratio</text>
  <text x="878" y="310" class="role" fill="#bfdbfe">summary()</text>

  <!-- quality legend -->
  <rect x="56" y="396" width="500" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="76" y="424" class="fn">_quality(text) &#8594; text grade</text>
  <rect x="76" y="442" width="92" height="28" rx="6" fill="#dcfce7"/><text x="122" y="461" text-anchor="middle" class="k" fill="#14532d">OK</text>
  <text x="180" y="461" class="role">letters &gt; 30% of text &#8212; a real text layer.</text>
  <rect x="76" y="478" width="92" height="28" rx="6" fill="#fef9c3"/><text x="122" y="497" text-anchor="middle" class="k" fill="#713f12">SUSPECT</text>
  <text x="180" y="497" class="role">mostly digits/symbols &#8212; garbled layer.</text>
  <rect x="76" y="514" width="92" height="28" rx="6" fill="#e2e8f0"/><text x="122" y="533" text-anchor="middle" class="k" fill="#334155">EMPTY</text>
  <text x="180" y="533" class="role">&lt; 50 chars &#8212; scanned image / cover. The locator skips these.</text>

  <!-- why -->
  <rect x="588" y="396" width="556" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="610" y="424" class="stage" font-size="16" fill="#92400e">Why it&#39;s built this way</text>
  <text x="610" y="452" class="role">&#8226;  pypdf for the full-document pass (fast); pdfplumber is</text>
  <text x="610" y="472" class="role">   reserved for the few pages actually extracted.</text>
  <text x="610" y="500" class="role">&#8226;  A high landscape_ratio hints at wide A3 sheets &#8212; a</text>
  <text x="610" y="520" class="role">   signal for the Geometry two-up split that follows.</text>
</svg>
